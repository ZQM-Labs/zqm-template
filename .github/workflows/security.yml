name: Security Scan
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan reachable repository history, not only the shallow checkout.
          fetch-depth: 0
      - name: Scan repository history with the Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          # The checkout lives inside the runner container and is not visible to
          # the Docker daemon, so it is copied into a created container instead
          # of bind-mounted.
          cid="$(docker create ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --config=/repo/.gitleaks.toml --redact --exit-code=1 --verbose)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "${GITHUB_WORKSPACE}/." "$cid:/repo"
          docker start -a "$cid"
