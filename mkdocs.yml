site_name: zqm-template
site_description: ZQM template repository documentation
site_author: ZQM Labs
repo_url: https://github.com/ZQM-Labs/zqm-template

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md